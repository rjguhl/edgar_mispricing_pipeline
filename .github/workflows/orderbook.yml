name: Order-book snapshots

# Order-book snapshot of every open Polymarket earnings contract every 30
# minutes, committed to the `orderbook-data` branch (kept off main so code
# history stays clean). See src/ingestion/orderbook_collector.py.
#
# GitHub delays and drops scheduled runs on free accounts (an hourly cron ran
# about every 4 hours), so each run stays alive and snapshots on its own
# timer for ~5.5 hours; the concurrency group queues the next run to start
# as soon as this one ends, keeping coverage continuous.

on:
  schedule:
    - cron: "17 * * * *"  # off the top of the hour to dodge scheduler congestion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orderbook
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Check out data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin orderbook-data; then
            git worktree add data-branch origin/orderbook-data
            git -C data-branch checkout -B orderbook-data
          else
            git worktree add --detach data-branch
            git -C data-branch checkout --orphan orderbook-data
            git -C data-branch rm -rfq .
          fi

      - name: Snapshot every 30 minutes for ~5.5 hours
        run: |
          end=$((SECONDS + 19800))
          while :; do
            if python -m src.ingestion.orderbook_collector --out data-branch/snapshots; then
              git -C data-branch add snapshots
              if ! git -C data-branch diff --cached --quiet; then
                git -C data-branch commit -qm "Order-book snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
                git -C data-branch push -q origin orderbook-data || echo "push failed; will retry next cycle"
              fi
            else
              echo "snapshot failed; will retry next cycle"
            fi
            [ $SECONDS -ge $end ] && break
            sleep 1800
          done
