name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          # Install only the lightweight runtime deps needed for tests.
          # Avoid airflow/dbt/spacy here to keep CI fast.
          pip install pandas numpy scikit-learn xgboost anthropic boto3 \
                      fredapi requests python-dotenv pydantic streamlit plotly

      - name: Lint with ruff
        run: ruff check src tests dags

      - name: Run pytest
        env:
          USE_FIXTURES: "true"
          ANTHROPIC_API_KEY: "test"
          FRED_API_KEY: "test"
        run: pytest -q --cov=src --cov-report=term-missing
